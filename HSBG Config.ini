; ============================================================================
;  HSBG -- settings
; ============================================================================
;  Edit a value, save, then exit HSBG from the tray icon and start it again.
;  AutoHotkey does not reload a running script, and this file is read once
;  at start-up.
;
;  Every setting is 1 for on, 0 for off. Delete this file to get it back
;  with the defaults.
; ----------------------------------------------------------------------------

[Settings]

; MonitorLock -- default 1 (on)
;
;   1 = Battle.net, the Blizzard Update Agent, Hearthstone and the on-screen
;       status text all open on the monitor you STARTED THIS SCRIPT ON.
;       Start it on the screen you want to play on and everything follows.
;   0 = every window opens wherever Windows and the applications decide,
;       and the script never moves anything.
;
;   Makes no difference on a single-monitor machine: there is only one place
;   for a window to be. Firestone's own windows are never covered by this --
;   they stay wherever you put them, which is usually a second screen.
MonitorLock=1

; HotkeyAudio -- default 1 (on)
;
;   1 = play a short, deep guitar note when a hotkey fires, so you know a
;       press registered without looking away from the game. All keys now
;       sound the same (the F2 note) unless you customise frequencies below.
;   0 = silent.
;
;   The notes are generated on first use and cached, so this costs about
;   a second on one start-up and nothing afterwards. Set 0 if you would
;   rather it were silent.
HotkeyAudio=1

; HotkeyAudioVolume -- 0 to 100, default 25
;   Ignored while HotkeyAudio=0.
HotkeyAudioVolume=25

; HotkeySoundFile -- optional custom .wav file to play for all hotkeys.
;   If left empty, the built-in synthesised note is used (with frequencies
;   configured below). The path must point to an existing PCM WAV file.
;   If the file is missing, the script falls back to the default tone.
HotkeySoundFile=

; HotkeyFreqMode -- how frequencies are chosen for the built-in tones.
;   "singular" = all hotkeys use the same frequency (set by HotkeyFreqSingular).
;   "varied"   = each key uses its own frequency (HotkeyFreqF1..F4).
;   Default: singular.
HotkeyFreqMode=singular

; HotkeyFreqSingular -- frequency in Hz for all keys when mode is "singular".
;   Default: 110.0 (the F2 note). Must be a positive number.
HotkeyFreqSingular=110.0

; HotkeyFreqF1..F4 -- individual frequencies when mode is "varied".
;   If left blank or set to 0, that key falls back to HotkeyFreqSingular.
;   Defaults: F1=82.41, F2=110.00, F3=73.42, F4=55.00 (the original notes).
HotkeyFreqF1=82.41
HotkeyFreqF2=110.00
HotkeyFreqF3=73.42
HotkeyFreqF4=55.00